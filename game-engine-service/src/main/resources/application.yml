server:
  port: 8081

spring:
  application:
    name: game-engine-service
  datasource:
    url: jdbc:h2:mem:game_engine;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
