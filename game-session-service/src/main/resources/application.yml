server:
  port: 8082

spring:
  application:
    name: game-session-service
  datasource:
    url: jdbc:h2:mem:game_session;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

game-engine:
  base-url: http://localhost:8081
